<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>माझे प्रोफाइल | Personal Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: #3b82f6;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
        }

        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            text-decoration: none;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .link-btn:hover {
            background: #3b82f6;
            border-color: #60a5fa;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">🚀</div>
        <h1>माझे नाव (Your Name)</h1>
        <p>Developer & Tech Enthusiast</p>

        <div class="links">
            <a href="https://github.com" target="_blank" class="link-btn">GitHub Profile</a>
            <a href="https://linkedin.com" target="_blank" class="link-btn">LinkedIn Profile</a>
            <a href="https://twitter.com" target="_blank" class="link-btn">Twitter / X</a>
            <a href="mailto:example@email.com" class="link-btn">Contact Me</a>
        </div>
    </div>

</body>
</html>
